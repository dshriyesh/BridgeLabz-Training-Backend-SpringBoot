spring.config.import=optional:file:.env[.properties]
spring.application.name=fundoo-notes
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/fundoo_notes?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-me-in-env}
app.jwt.access-token-expiry-ms=604800000
app.jwt.refresh-token-expiry-ms=2592000000
app.otp.expiry-seconds=300
app.reminder.scheduler-delay-ms=60000
app.notes.trash-retention-days=30
app.notes.cleanup.scheduler-delay-ms=3600000
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.health.rabbit.enabled=false
management.health.redis.enabled=false
management.health.mail.enabled=false
file.storage.path=${FILE_STORAGE_PATH:uploads}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app.email-verification.expiry-hours=${APP_EMAIL_VERIFICATION_EXPIRY_HOURS:24}
app.email-verification.base-url=${APP_EMAIL_VERIFICATION_BASE_URL:http://localhost:8080/api/v1/auth/verify-email?token=}
